version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        json_tags_case_style: snake
        # sqlc matches db_type by exact string and does not normalise short aliases like bool, int4,
        # timetz or timestamptz. So timestamptz is listed twice below. A missed override fails silently.
        overrides:
          - db_type: pg_catalog.timestamp
            nullable: false
            go_type:
              import: time
              type: Time
          - db_type: pg_catalog.timestamp
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            nullable: false
            go_type:
              import: time
              type: Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: "date"
            nullable: false
            go_type:
              import: time
              type: Time
          - db_type: "date"
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: time
              type: Time
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
